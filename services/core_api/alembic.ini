# Alembic for the `core` schema. Run from this directory:
#   DATABASE_URL=postgresql://... alembic upgrade head
[alembic]
script_location = core_api:migrations
# Revisions are numbered, not hashed, so the order reads at a glance.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
