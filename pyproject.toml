[project]
name = "llm-dev-kit"
version = "0.2.0"
description = "Local-first microservices LLM development kit: offline Ollama plus cloud providers via LiteLLM, RAG, a built-in static chat UI, and an Nginx load balancer."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are per-service: see services/*/requirements.txt
dependencies = []

[project.optional-dependencies]
dev = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "pypdf",
    "pytest",
    "python-multipart",
    "redis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "services/devkit_common/src",
    "services/llm_service/src",
    "services/rag_service/src",
    "services/mcp_service/src",
    ".",
]
