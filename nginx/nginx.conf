worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS returns one A record per replica, and nginx
    # round-robins across all of them. `resolve` keeps re-asking it: a backend
    # recreated by `docker compose up --build` comes back on a new IP, and an
    # address resolved once at startup would keep sending traffic to the old
    # one (or to whichever container picked it up). Needs nginx 1.27.3+.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream llm_service {
        zone llm_service 64k;
        server llm-service:8010 resolve;
    }

    upstream rag_service {
        zone rag_service 64k;
        server rag-service:8020 resolve;
    }

    upstream web_app {
        zone web_app 64k;
        server web:3000 resolve;
    }

    # Only exists with the sso profile; until then /sso answers 502.
    upstream keycloak {
        zone keycloak 64k;
        server keycloak:8080 resolve;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Send "Connection: upgrade" only when the client asked to upgrade,
    # otherwise "close". Passing a bare "upgrade" on ordinary requests breaks
    # keepalive against the upstream.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        client_max_body_size 64m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Streaming (SSE) must not be buffered.
        proxy_buffering off;

        # OpenAI-compatible RAG API (used by Open WebUI and any OpenAI SDK)
        location /v1/ {
            proxy_pass http://rag_service;
        }

        # RAG service REST API (chat, ingest, cache, documents)
        location /api/rag/ {
            proxy_pass http://rag_service/;
        }

        # LLM router service (models, providers, generate, embed)
        location /api/llm/ {
            proxy_pass http://llm_service/;
        }

        # Keycloak (sso profile). It serves itself under /sso, so the path
        # passes through unchanged; its tokens and login pages are large.
        location /sso/ {
            proxy_pass http://keycloak;
            proxy_set_header Host $http_host;
            # Host and port as the browser sent them. No X-Forwarded-Port:
            # nginx listens on 80 inside its container, which would override
            # the published port and break the URLs Keycloak builds.
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # The web app's own API (/api/auth, /api/chat, /api/chats, /api/admin,
        # /api/keys, /api/health ...). Proxied exactly like the catch-all
        # below, but with no error_page: when web is down, slow or overloaded
        # a client gets the real 502, 503 or 504, so scripts, monitors,
        # retries and load tests see the failure instead of a 200 HTML page.
        # /api/rag/ and /api/llm/ above are longer prefixes, so they still win
        # by longest-prefix match and never reach this block.
        location /api/ {
            proxy_pass http://web_app;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # The chat application's pages (Next.js). This is the catch-all, so
        # the more specific /v1/, /api/ and /sso/ prefixes above win by
        # longest-prefix match.
        location / {
            proxy_pass http://web_app;

            # Next.js needs the real origin to build absolute URLs and to
            # validate the auth callback against the right host.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;

            # Websocket upgrade, used by the dev server's hot reload.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # nginx starts as soon as its upstreams' containers exist (see
            # depends_on in docker-compose.yml), well before they're actually
            # healthy — first launch and cold starts can take a minute or two.
            # Until the web app responds, show a branded "starting up" page
            # instead of a raw 502/503/504, and keep polling. Scoped to page
            # navigations: /v1/ and every /api/ route keep real error codes
            # for API clients.
            proxy_intercept_errors on;
            error_page 502 503 504 =200 /_starting.html;
        }

        location = /_starting.html {
            internal;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
        }
    }
}
