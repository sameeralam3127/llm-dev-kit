worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS returns one A record per replica; nginx resolves the
    # service name at startup and round-robins across all of them.
    upstream llm_service {
        server llm-service:8010;
    }

    upstream rag_service {
        server rag-service:8020;
    }

    upstream webhook_service {
        server webhook-service:8030;
    }

    upstream web_app {
        server web:3000;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Send "Connection: upgrade" only when the client asked to upgrade,
    # otherwise "close". Passing a bare "upgrade" on ordinary requests breaks
    # keepalive against the upstream.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        client_max_body_size 64m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Streaming (SSE) must not be buffered.
        proxy_buffering off;

        # OpenAI-compatible RAG API (used by Open WebUI and any OpenAI SDK)
        location /v1/ {
            proxy_pass http://rag_service;
        }

        # RAG service REST API (chat, ingest, cache, documents)
        location /api/rag/ {
            proxy_pass http://rag_service/;
        }

        # LLM router service (models, providers, generate, embed)
        location /api/llm/ {
            proxy_pass http://llm_service/;
        }

        # GitHub webhooks
        location /webhooks/ {
            proxy_pass http://webhook_service;
        }

        # The chat application (Next.js). This is the catch-all, so the more
        # specific /v1/, /api/rag/, /api/llm/ and /webhooks/ prefixes above win
        # by longest-prefix match and never reach the app. The app's own routes
        # (/api/auth, /api/chat, /api/chats, /api/folders, /api/models) do not
        # collide with any of them.
        location / {
            proxy_pass http://web_app;

            # Next.js needs the real origin to build absolute URLs and to
            # validate the auth callback against the right host.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;

            # Websocket upgrade, used by the dev server's hot reload.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
