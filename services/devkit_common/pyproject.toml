[project]
name = "devkit-common"
version = "0.1.0"
description = "Shared config and models used across llm-dev-kit services."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
