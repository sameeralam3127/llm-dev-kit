<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Dev Kit</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --border: #2a2f40;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #6d8dff; --accent-2: #4f6df5;
    --green: #3ecf8e; --amber: #f5b14f; --red: #f56c6c; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; margin-right: auto; }
  header h1 span { color: var(--accent); }
  .stat { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); }

  .toolbar {
    display: flex; gap: 10px; padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap;
  }
  .toolbar label { font-size: 12px; color: var(--muted); }
  select, input[type="password"] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  #apiKeyWrap { display: none; align-items: center; gap: 6px; }
  #apiKeyWrap.visible { display: flex; }
  #apiKey { width: 220px; }

  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent-2); border-color: var(--accent-2); }
  button.primary:hover { background: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #chat { flex: 1; overflow-y: auto; padding: 20px 0; }
  .inner { max-width: 820px; margin: 0 auto; padding: 0 18px; }

  .msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .msg .bubble {
    padding: 10px 14px; border-radius: var(--radius); max-width: 92%;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble { background: var(--accent-2); color: #fff; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg .tags { display: flex; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--muted); }
  .tag {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 20px; padding: 1px 8px;
  }
  .tag.cache { color: var(--green); border-color: var(--green); }
  .bubble code { background: #0b0d13; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble pre {
    background: #0b0d13; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; overflow-x: auto; margin: 8px 0; font-size: 13px;
  }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent);
    animation: blink .8s infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }

  details.sources { margin-top: 6px; font-size: 12px; color: var(--muted); max-width: 92%; }
  details.sources pre {
    background: var(--panel-2); border-radius: 6px; padding: 8px;
    white-space: pre-wrap; margin-top: 4px; max-height: 180px; overflow-y: auto;
  }

  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 18px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; background: var(--panel-2); color: var(--text); resize: none;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; font: inherit; outline: none; max-height: 160px;
  }
  #input:focus { border-color: var(--accent); }

  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; display: none; z-index: 10;
  }
  #toast.show { display: block; }
  #toast.err { border-color: var(--red); color: var(--red); }

  .empty { text-align: center; color: var(--muted); margin-top: 60px; }
  .empty h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <h1>LLM <span>Dev Kit</span></h1>
  <span class="stat"><span class="dot" id="dotLlm"></span> LLM</span>
  <span class="stat"><span class="dot" id="dotDocs"></span> Docs: <b id="docCount">–</b></span>
  <span class="stat"><span class="dot" id="dotCache"></span> Cache: <b id="cacheKeys">–</b></span>
  <button id="clearCache" title="Clear the Redis response cache">Clear cache</button>
  <button id="clearChat">New chat</button>
</header>

<div class="toolbar">
  <label>Provider</label>
  <select id="provider">
    <option value="ollama">Local (Ollama)</option>
    <option value="openai">OpenAI</option>
    <option value="gemini">Gemini</option>
    <option value="anthropic">Anthropic</option>
  </select>
  <label>Model</label>
  <select id="model"></select>
  <span id="apiKeyWrap">
    <label for="apiKey">API key</label>
    <input type="password" id="apiKey" placeholder="paste key (stored locally)">
  </span>
  <span style="margin-left:auto"></span>
  <input type="file" id="pdfFile" accept="application/pdf" hidden>
  <button id="uploadBtn" title="Index a PDF into the RAG store">&#128196; Upload PDF</button>
</div>

<div id="chat"><div class="inner" id="messages">
  <div class="empty" id="empty">
    <h2>Ask anything</h2>
    <p>Answers are grounded in your indexed documents.<br>
    Upload a PDF to add it to the knowledge base.</p>
  </div>
</div></div>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Send a message…"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
</footer>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { models: [], streaming: false };

// ---------------------------------------------------------------- helpers
function toast(msg, isErr = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = ""), 3500);
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Minimal markdown: fenced code blocks, inline code, bold. Keeps rendering fast.
function renderMd(s) {
  let html = escapeHtml(s);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => `<pre><code>${c}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  return html;
}

function apiKeyStorageKey() { return "llmdevkit-key-" + $("provider").value; }

// ---------------------------------------------------------------- status bar
async function refreshStatus() {
  try {
    const h = await (await fetch("/api/llm/health")).json();
    $("dotLlm").className = "dot " + (h.status === "ok" ? "ok" : "bad");
  } catch { $("dotLlm").className = "dot bad"; }
  try {
    const d = await (await fetch("/api/rag/documents/stats")).json();
    $("docCount").textContent = d.document_count;
    $("dotDocs").className = "dot " + (d.status === "connected" ? "ok" : "bad");
  } catch { $("dotDocs").className = "dot bad"; }
  try {
    const c = await (await fetch("/api/rag/cache/stats")).json();
    $("cacheKeys").textContent = c.keys;
    $("dotCache").className = "dot " + (c.status === "connected" ? "ok" : "bad");
  } catch { $("dotCache").className = "dot bad"; }
}

// ---------------------------------------------------------------- models
async function loadModels() {
  try {
    const res = await (await fetch("/api/llm/models")).json();
    state.models = res.models || [];
  } catch { state.models = []; }
  fillModelSelect();
}

function fillModelSelect() {
  const provider = $("provider").value;
  const sel = $("model");
  sel.innerHTML = "";
  const mine = state.models.filter((m) =>
    provider === "ollama" ? !m.includes("/") : m.startsWith(provider + "/")
  );
  for (const m of mine) {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = provider === "ollama" ? m : m.slice(provider.length + 1);
    sel.appendChild(opt);
  }
  if (!mine.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = provider === "ollama" ? "no local models found" : "no models";
    sel.appendChild(opt);
  }
  const remembered = localStorage.getItem("llmdevkit-model-" + provider);
  if (remembered && mine.includes(remembered)) sel.value = remembered;
}

$("provider").addEventListener("change", () => {
  fillModelSelect();
  const wrap = $("apiKeyWrap");
  wrap.className = $("provider").value === "ollama" ? "" : "visible";
  $("apiKey").value = localStorage.getItem(apiKeyStorageKey()) || "";
});
$("model").addEventListener("change", () =>
  localStorage.setItem("llmdevkit-model-" + $("provider").value, $("model").value)
);
$("apiKey").addEventListener("change", () =>
  localStorage.setItem(apiKeyStorageKey(), $("apiKey").value.trim())
);

// ---------------------------------------------------------------- chat
function addMessage(role, text) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="bubble"></div><div class="tags"></div>`;
  div.querySelector(".bubble").innerHTML = role === "user" ? escapeHtml(text) : text;
  $("messages").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

async function send() {
  const text = $("input").value.trim();
  if (!text || state.streaming) return;
  const model = $("model").value;
  if (!model) return toast("Pick a model first", true);
  const provider = $("provider").value;
  const apiKey = provider === "ollama" ? null : $("apiKey").value.trim() || null;

  $("input").value = "";
  autoSize();
  addMessage("user", text);
  const botDiv = addMessage("bot", '<span class="cursor"></span>');
  const bubble = botDiv.querySelector(".bubble");
  state.streaming = true;
  $("send").disabled = true;

  let acc = "", meta = null, done = null;
  try {
    const res = await fetch("/api/rag/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, model, api_key: apiKey }),
    });
    if (!res.ok) throw new Error((await res.text()).slice(0, 300));

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const evt = JSON.parse(line);
        if (evt.error) throw new Error(evt.error);
        if (evt.meta) meta = evt.meta;
        if (evt.delta) {
          acc += evt.delta;
          bubble.innerHTML = renderMd(acc) + '<span class="cursor"></span>';
          $("chat").scrollTop = $("chat").scrollHeight;
        }
        if (evt.done) done = evt;
      }
    }
    bubble.innerHTML = renderMd(acc) || "<i>(empty response)</i>";

    const tags = botDiv.querySelector(".tags");
    if (meta?.cached) tags.innerHTML += '<span class="tag cache">&#9889; cached</span>';
    if (done?.model) tags.innerHTML += `<span class="tag">${escapeHtml(done.model)}</span>`;
    if (meta?.sources?.length) {
      const det = document.createElement("details");
      det.className = "sources";
      det.innerHTML =
        `<summary>${meta.sources.length} source${meta.sources.length > 1 ? "s" : ""}</summary>` +
        meta.sources.map((s) => `<pre>${escapeHtml(s)}</pre>`).join("");
      botDiv.appendChild(det);
    }
  } catch (err) {
    bubble.innerHTML = renderMd(acc) +
      `<div style="color:var(--red);margin-top:6px">Error: ${escapeHtml(String(err.message || err))}</div>`;
  } finally {
    state.streaming = false;
    $("send").disabled = false;
    refreshStatus();
    $("input").focus();
  }
}

$("send").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
function autoSize() {
  const i = $("input");
  i.style.height = "auto";
  i.style.height = Math.min(i.scrollHeight, 160) + "px";
}
$("input").addEventListener("input", autoSize);

// ---------------------------------------------------------------- PDF upload
$("uploadBtn").addEventListener("click", () => $("pdfFile").click());
$("pdfFile").addEventListener("change", async () => {
  const file = $("pdfFile").files[0];
  if (!file) return;
  $("uploadBtn").disabled = true;
  $("uploadBtn").textContent = "Indexing…";
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch("/api/rag/ingest/pdf", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    toast(`Indexed "${file.name}" — ${data.chunks} chunks added`);
    refreshStatus();
  } catch (err) {
    toast("Upload failed: " + (err.message || err), true);
  } finally {
    $("uploadBtn").disabled = false;
    $("uploadBtn").innerHTML = "&#128196; Upload PDF";
    $("pdfFile").value = "";
  }
});

// ---------------------------------------------------------------- misc
$("clearCache").addEventListener("click", async () => {
  try {
    const res = await (await fetch("/api/rag/cache/clear", { method: "POST" })).json();
    toast(`Cleared ${res.cleared} cached responses`);
    refreshStatus();
  } catch { toast("Cache clear failed", true); }
});
$("clearChat").addEventListener("click", () => {
  $("messages").innerHTML =
    '<div class="empty" id="empty"><h2>Ask anything</h2><p>Answers are grounded in your indexed documents.<br>Upload a PDF to add it to the knowledge base.</p></div>';
});

refreshStatus();
loadModels();
setInterval(refreshStatus, 30000);
$("input").focus();
</script>
</body>
</html>
