<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3">
<title>LLM Dev Kit — starting up</title>
<style>
  :root {
    --background: 0 0% 100%;
    --foreground: 224 12% 12%;
    --muted-foreground: 220 9% 46%;
    --primary: 224 76% 48%;
    --border: 220 13% 89%;
    --card: 0 0% 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: 224 14% 9%;
      --foreground: 220 14% 92%;
      --muted-foreground: 220 9% 62%;
      --primary: 217 91% 62%;
      --border: 223 12% 20%;
      --card: 224 14% 11%;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }

  .card {
    max-width: 26rem;
  }

  .ring {
    width: 2.75rem;
    height: 2.75rem;
    margin: 0 auto 1.5rem;
    border-radius: 9999px;
    border: 3px solid hsl(var(--border));
    border-top-color: hsl(var(--primary));
    animation: spin 0.9s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring {
      animation: none;
      border-top-color: hsl(var(--border));
    }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }

  p {
    font-size: 0.9375rem;
    line-height: 1.5;
    color: hsl(var(--muted-foreground));
    margin: 0;
  }

  .hint {
    margin-top: 1.5rem;
    font-size: 0.8125rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ring" role="presentation"></div>
    <h1>LLM Dev Kit is starting up</h1>
    <p>Backend services are coming online. First launch can take a minute or two while containers and models warm up.</p>
    <p class="hint">This page checks again automatically every few seconds.</p>
  </div>
</body>
</html>
