# Weekly, grouped dependency updates: a few pull requests a week, not dozens.
# Major versions are ignored here and upgraded on purpose, since they can break
# the build or the UI. Security updates are switched on separately, in the
# repository settings.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/services/*"
      - "/services/plugins/*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: npm
    directory: "/web"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Base images are pinned by digest; this keeps the digests current.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/web"
    # Patch tags and digest refreshes only: a new Python, Node or nginx minor is
    # an upgrade to plan, not a weekly bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "fix(deps)"
