name: CI

# Lint, typecheck, test and build for the Python services and the web app.
# Runs on pull requests and on pushes to every branch except main; main and
# version tags run it through publish.yml, which calls this workflow and only
# pushes images once it passes.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    # A real Chroma for the vector_store.chroma contract suite; same version
    # as docker-compose.yml.
    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
    env:
      LDK_TEST_CHROMA_HOST: localhost
      LDK_TEST_CHROMA_PORT: "8000"
    steps:
      - uses: actions/checkout@v7

      # Matches the python:3.12-slim base in the root Dockerfile.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
            services/core/pyproject.toml

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check services tests

      - name: ruff format
        run: ruff format --check services tests

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # Matches the node:20-slim base in web/Dockerfile.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      # Placeholders mirror web/Dockerfile: next build evaluates the env schema
      # while prerendering, but no real credential is needed.
      - name: build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/build.db
          AUTH_SECRET: build-placeholder-not-a-real-credential

  # Build each Python image and prove it starts: plugins are discovered from
  # installed entry points, so a Dockerfile that copies instead of installing
  # only fails at runtime. Nothing is pushed.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: llm-service
            port: "8010"
          - service: rag-service
            port: "8020"
          - service: mcp-service
            port: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          load: true
          push: false
          tags: ldk-ci/${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Start and wait for /health
        if: matrix.port != ''
        run: |
          docker run -d --name svc -p ${{ matrix.port }}:${{ matrix.port }} ldk-ci/${{ matrix.service }}:test
          for _ in $(seq 1 30); do
            if curl -fsS localhost:${{ matrix.port }}/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs svc
          exit 1

      - name: Import check
        if: matrix.port == ''
        run: docker run --rm ldk-ci/${{ matrix.service }}:test python -c "import mcp_service.main"
