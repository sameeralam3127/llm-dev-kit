[project]
name = "ldk-plugin-loader-pdf"
version = "0.1.0"
description = "llm-dev-kit plugin: PDF document loader (pypdf), page by page."
requires-python = ">=3.12"
dependencies = [
    "ldk-core",
    "pypdf>=4",
]

[project.entry-points."llm_dev_kit.plugins"]
"loader.pdf" = "ldk_plugin_loader_pdf:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ldk_plugin_loader_pdf = ["py.typed", "manifests/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
