# Optional overlay that adds the full chat app to the main stack.
#
#   docker compose -f docker-compose.yml -f web/docker-compose.web.yml up --build
#
# Kept separate so the default `docker compose up` stays as light as it is now —
# the static ui/ page remains the zero-dependency default.

services:
  web:
    build:
      context: ./web
    environment:
      # Inside the compose network, reach rag-service directly rather than
      # looping back out through nginx.
      LLM_BASE_URL: http://rag-service:8020/v1
      LLM_API_KEY: ${LLM_API_KEY:-sk-local}
      DEFAULT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      DATABASE_URL: file:/data/web.db
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — openssl rand -base64 32}
      AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - web-data:/data
    ports:
      - "3000:3000"
    depends_on:
      rag-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web-data:
