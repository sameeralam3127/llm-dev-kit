# While a service starts, it is checked every second (start_interval), so it
# counts as healthy within a second of being ready. After start_period, it is
# checked every 15 s as before. Without start_interval, Docker waits a full
# interval before the first check, which added ~15 s to every step of the
# startup chain.
x-python-healthcheck: &python-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s
  start_interval: 1s

# Raises the open-file-descriptor ceiling for services that hold many
# concurrent connections (nginx, and anything proxying/streaming requests).
# The container default (1024) is the first thing to bite under real load.
x-high-connection-ulimits: &high-connection-ulimits
  nofile:
    soft: 65536
    hard: 65536

services:
  # ----------------------------------------------------------------- gateway
  # The only published port. Routes /v1/, /api/rag/, /api/llm/ to the Python
  # services and everything else to the web app. Bound to 127.0.0.1 unless
  # GATEWAY_BIND says otherwise: the APIs behind it have no authentication
  # until Phase 4, so LAN access is an explicit opt-in (see .env.example).
  nginx:
    build:
      context: .
      target: gateway
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits: *high-connection-ulimits
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 128M
    # No depends_on: every upstream uses `resolve`, so nginx starts before the
    # services exist and finds them as they come up. :8080 answers at once,
    # with the "starting up" page (see nginx.conf) until the web app responds.
    restart: unless-stopped

  # ---------------------------------------------------------------- frontend
  # Next.js chat app: accounts, persistent history, folders, sharing.
  web:
    build:
      context: ./web
    environment:
      # Inside the network, reach rag-service directly rather than looping
      # back out through nginx.
      LLM_BASE_URL: http://rag-service:8020/v1
      # Checked by the admin health page.
      RAG_SERVICE_URL: http://rag-service:8020
      LLM_SERVICE_URL: http://llm-service:8010
      GRAFANA_URL: ${GRAFANA_URL:-}
      DEFAULT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      DATABASE_URL: file:/data/web.db
      # No default on purpose — a shipped signing key would let anyone forge a
      # session. Generate one: openssl rand -base64 32
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env - run openssl rand -base64 32}"
      AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      AUTH_TRUST_HOST: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # SSO (sso profile). Registered only when all three are set.
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:-}
      # How this container reaches the same issuer: through the network, not
      # the public URL, which inside a container points back at itself.
      AUTH_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/sso/realms/llm-dev-kit
    volumes:
      - web_data:/data
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.0"
          memory: 768M
    # No depends_on: the web app never calls rag-service at boot, only when
    # someone chats, so it starts at once and the sign-in page shows while the
    # backend is still starting.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  # ----------------------------------------------------------- microservices
  # The images carry their own source and run without --reload. For hot
  # reload, layer compose.dev.yml on top (see its header).
  llm-service:
    build:
      context: .
      target: llm-service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # Callers are verified against the web app's keys (AUTH_JWKS_URL defaults
      # to http://web:3000/.well-known/jwks.json); see docs/v2/MIGRATION.md.
      ALLOW_LEGACY_ANONYMOUS: ${ALLOW_LEGACY_ANONYMOUS:-false}
      # Optional: also accept access tokens straight from an OIDC issuer.
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_DISCOVERY_URL: ${AUTH_OIDC_DISCOVERY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits: *high-connection-ulimits
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      <<: *python-healthcheck
    restart: unless-stopped

  rag-service:
    build:
      context: .
      target: rag-service
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "1.5"
          memory: 1536M
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LLM_SERVICE_URL: http://llm-service:8010
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      CACHE_TTL: ${CACHE_TTL:-3600}
      ALLOW_LEGACY_ANONYMOUS: ${ALLOW_LEGACY_ANONYMOUS:-false}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_DISCOVERY_URL: ${AUTH_OIDC_DISCOVERY_URL:-}
    ulimits: *high-connection-ulimits
    depends_on:
      llm-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=3)"]
      <<: *python-healthcheck
    restart: unless-stopped

  mcp:
    build:
      context: .
      target: mcp-service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LLM_SERVICE_URL: http://llm-service:8010
      RAG_SERVICE_URL: http://rag-service:8020
      # A personal API key (account menu → API keys); every tool call acts as
      # its owner. Without one, tool calls are refused with 401.
      LDK_API_KEY: ${LDK_API_KEY:-}
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      rag-service:
        condition: service_healthy
    profiles:
      - mcp

  # ----------------------------------------------------------- infrastructure
  # Redis, Chroma and Ollama are reachable only on the Compose network: the
  # services talk to them by name, and none of them has authentication. For
  # host access while debugging, see docs/setup.md ("Reaching Redis or Chroma
  # from the host").
  redis:
    image: redis:7.4.11-alpine
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "2.0"
          memory: 2048M
    restart: unless-stopped

  # Optional: run Ollama in Docker instead of on the host. Enable with
  # `docker compose --profile ollama up` and set OLLAMA_HOST=http://ollama:11434
  # in .env. Note: on macOS this runs CPU-only; host Ollama is faster.
  ollama:
    image: ollama/ollama:0.32.14
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          cpus: "1.0"
          memory: 1024M
        limits:
          cpus: "4.0"
          memory: 6144M
    profiles:
      - ollama
    restart: unless-stopped

  # Optional: single sign-on with Keycloak. Enable with
  # `docker compose --profile sso up` after setting KEYCLOAK_ADMIN_PASSWORD,
  # AUTH_KEYCLOAK_ID and AUTH_KEYCLOAK_SECRET in .env (see .env.example). It
  # imports a ready llm-dev-kit realm and is served by the gateway at /sso.
  # Runs in Keycloak's dev mode on its own file database: fine for a team on
  # one machine, not a substitute for a production Keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_RELATIVE_PATH: /sso
      # The public URL; issuer and browser redirects use it. Calls from other
      # containers arrive as keycloak:8080 and get internal URLs back.
      KC_HOSTNAME: ${WEB_PUBLIC_URL:-http://localhost:8080}/sso
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # Substituted into the realm file on import.
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/llm-dev-kit-realm.json:/opt/keycloak/data/import/llm-dev-kit-realm.json:ro
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "2.0"
          memory: 1024M
    profiles:
      - sso
    restart: unless-stopped

volumes:
  chroma_data:
  keycloak_data:
  ollama_data:
  web_data:

networks:
  default:
    name: llm-dev-kit-network
