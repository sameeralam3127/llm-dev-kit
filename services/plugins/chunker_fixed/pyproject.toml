[project]
name = "ldk-plugin-chunker-fixed"
version = "0.1.0"
description = "llm-dev-kit plugin: Fixed-size character windows with overlap."
requires-python = ">=3.12"
dependencies = [
    "ldk-core",
]

[project.entry-points."llm_dev_kit.plugins"]
"chunker.fixed" = "ldk_plugin_chunker_fixed:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ldk_plugin_chunker_fixed = ["py.typed", "manifests/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
