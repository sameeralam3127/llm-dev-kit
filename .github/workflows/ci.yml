name: CI

# Lint, typecheck, test and build for the Python services and the web app.
# Runs on pull requests and on pushes to every branch except main; main and
# version tags run it through publish.yml, which calls this workflow and only
# pushes images once it passes.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    # A real Chroma for the vector_store.chroma contract suite; same version
    # as docker-compose.yml.
    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
    env:
      LDK_TEST_CHROMA_HOST: localhost
      LDK_TEST_CHROMA_PORT: "8000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Matches the python:3.12-slim base in the root Dockerfile.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
            services/core/pyproject.toml

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check services tests

      - name: ruff format
        run: ruff format --check services tests

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Matches the node:22-slim base in web/Dockerfile (Node 20 is end-of-life,
      # and Vitest 5 needs 22.12+).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      # Placeholders mirror web/Dockerfile: next build evaluates the env schema
      # while prerendering, but no real credential is needed.
      - name: build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/build.db
          AUTH_SECRET: build-placeholder-not-a-real-credential

  # Build each Python image and prove it starts: plugins are discovered from
  # installed entry points, so a Dockerfile that copies instead of installing
  # only fails at runtime. Nothing is pushed.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: llm-service
            context: .
            port: "8010"
            health: /health
          - service: rag-service
            context: .
            port: "8020"
            health: /health
          - service: mcp-service
            context: .
            port: ""
          # The web image pushes its SQLite schema on boot; a throwaway path
          # and placeholder secret are enough to prove it starts.
          - service: web
            context: web
            target: runtime
            port: "3000"
            health: /api/health
            run_args: >-
              -e DATABASE_URL=file:/data/ci.db
              -e AUTH_SECRET=ci-placeholder-not-a-real-credential-0123
              -e LLM_BASE_URL=http://127.0.0.1:9/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target || matrix.service }}
          load: true
          push: false
          tags: ldk-ci/${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Start and wait for /health
        if: matrix.port != ''
        run: |
          docker run -d --name svc ${{ matrix.run_args }} -p ${{ matrix.port }}:${{ matrix.port }} ldk-ci/${{ matrix.service }}:test
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null localhost:${{ matrix.port }}${{ matrix.health }}; then echo up; exit 0; fi
            sleep 1
          done
          docker logs svc
          exit 1

      - name: Import check
        if: matrix.port == ''
        run: docker run --rm ldk-ci/${{ matrix.service }}:test python -c "import mcp_service.main"

  # Start the whole stack the way users run it (`docker compose up`) and
  # smoke-test it through the gateway with scripts/smoke.sh: health of every
  # service, sign-in redirects, 401s on every API, security headers, and a
  # real registration. No model is installed, so this proves the wiring, not
  # the answers. Run the same check locally with `make e2e`.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compose needs only AUTH_SECRET; everything else has a default.
      - name: Write .env
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" > .env

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: SMOKE_REGISTER=1 scripts/smoke.sh

      - name: Service logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
