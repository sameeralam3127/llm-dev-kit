name: CI

# Lint, typecheck, test and build for the Python services and the web app.
# Runs on pull requests and on pushes to every branch except main; main and
# version tags run it through publish.yml, which calls this workflow and only
# pushes images once it passes.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches the python:3.12-slim base in the root Dockerfile.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check services tests

      - name: ruff format
        run: ruff format --check services tests

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # Matches the node:20-slim base in web/Dockerfile.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # Placeholders mirror web/Dockerfile: next build evaluates the env schema
      # while prerendering, but no real credential is needed.
      - name: build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/build.db
          AUTH_SECRET: build-placeholder-not-a-real-credential
