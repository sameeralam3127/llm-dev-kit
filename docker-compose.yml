x-python-healthcheck: &python-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10

# Raises the open-file-descriptor ceiling for services that hold many
# concurrent connections (nginx, and anything proxying/streaming requests).
# The container default (1024) is the first thing to bite under real load.
x-high-connection-ulimits: &high-connection-ulimits
  nofile:
    soft: 65536
    hard: 65536

services:
  # ----------------------------------------------------------------- gateway
  # The single published port. Routes /v1/, /api/rag/, /api/llm/ to the
  # Python services and everything else to the web app.
  nginx:
    build:
      context: .
      target: gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits: *high-connection-ulimits
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 128M
    # service_started, not service_healthy: nginx's static upstream blocks
    # only need the container to exist (so its hostname resolves) — not to be
    # fully healthy. This is what lets :8080 come up within seconds instead of
    # waiting for the whole backend chain, showing the "starting up" fallback
    # page (see nginx.conf) until each upstream actually starts responding.
    depends_on:
      llm-service:
        condition: service_started
      rag-service:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------- frontend
  # Next.js chat app: accounts, persistent history, folders, sharing.
  web:
    build:
      context: ./web
    environment:
      # Inside the network, reach rag-service directly rather than looping
      # back out through nginx.
      LLM_BASE_URL: http://rag-service:8020/v1
      LLM_API_KEY: ${LLM_API_KEY:-sk-local}
      DEFAULT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      DATABASE_URL: file:/data/web.db
      # No default on purpose — a shipped signing key would let anyone forge a
      # session. Generate one: openssl rand -base64 32
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env - run openssl rand -base64 32}"
      AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
      AUTH_TRUST_HOST: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - web_data:/data
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.0"
          memory: 768M
    # Ordering only, not a hard gate: the Next.js server itself never calls
    # rag-service at boot (only when a user actually chats), so it doesn't
    # need rag-service healthy to start and become reachable behind nginx.
    depends_on:
      rag-service:
        condition: service_started
    restart: unless-stopped

  # ----------------------------------------------------------- microservices
  llm-service:
    build:
      context: .
      target: llm-service
    command: uvicorn llm_service.main:app --host 0.0.0.0 --port 8010 --reload
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    volumes:
      - ./services/devkit_common/src/devkit_common:/app/devkit_common
      - ./services/llm_service/src/llm_service:/app/llm_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits: *high-connection-ulimits
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      <<: *python-healthcheck
    restart: unless-stopped

  rag-service:
    build:
      context: .
      target: rag-service
    command: uvicorn rag_service.main:app --host 0.0.0.0 --port 8020 --reload
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "1.5"
          memory: 1536M
    environment:
      LLM_SERVICE_URL: http://llm-service:8010
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-llama3.1}
      CACHE_TTL: ${CACHE_TTL:-3600}
    volumes:
      - ./services/devkit_common/src/devkit_common:/app/devkit_common
      - ./services/rag_service/src/rag_service:/app/rag_service
    ulimits: *high-connection-ulimits
    depends_on:
      llm-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=3)"]
      <<: *python-healthcheck
    restart: unless-stopped

  mcp:
    build:
      context: .
      target: mcp-service
    environment:
      LLM_SERVICE_URL: http://llm-service:8010
      RAG_SERVICE_URL: http://rag-service:8020
    volumes:
      - ./services/devkit_common/src/devkit_common:/app/devkit_common
      - ./services/mcp_service/src/mcp_service:/app/mcp_service
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 128M
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      rag-service:
        condition: service_healthy
    profiles:
      - mcp

  # ----------------------------------------------------------- infrastructure
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "2.0"
          memory: 2048M
    restart: unless-stopped

  # Optional: run Ollama in Docker instead of on the host. Enable with
  # `docker compose --profile ollama up` and set OLLAMA_HOST=http://ollama:11434
  # in .env. Note: on macOS this runs CPU-only; host Ollama is faster.
  ollama:
    image: ollama/ollama:0.32.14
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          cpus: "1.0"
          memory: 1024M
        limits:
          cpus: "4.0"
          memory: 6144M
    profiles:
      - ollama
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
  web_data:

networks:
  default:
    name: llm-dev-kit-network
